name: Request reviewers

# The org plan does not support branch protection or CODEOWNERS
# auto-requests on private repositories, so this workflow requests the
# reviewers on every pull request instead. One approval is enough to merge.

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - name: Request reviews from the team
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        # One REST call with the full list: `gh pr edit --add-reviewer`
        # can replace existing requests instead of adding to them.
        run: |
          args=""
          for u in devnullexile ArcsinX Sanek1710; do
            if [ "$u" != "$AUTHOR" ]; then
              args="$args -f reviewers[]=$u"
            fi
          done
          gh api -X POST \
            "repos/${{ github.repository }}/pulls/$PR/requested_reviewers" \
            $args
