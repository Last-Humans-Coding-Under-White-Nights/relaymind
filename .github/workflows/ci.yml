name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  # No base-branch filter: stacked PRs (feature branch onto feature
  # branch) must get CI too.
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        # Target platforms per spec (macOS and Windows); Ubuntu as the fast default.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e ".[dev]"

      # The browser test of the demo UI page script (#89) needs Chromium.
      - name: Install browser
        run: playwright install --with-deps chromium

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest
