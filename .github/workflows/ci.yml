name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  # No base-branch filter: stacked PRs must get CI too, on Linux only to
  # conserve CI capacity. Every PR must target master and pass the full
  # Linux/macOS/Windows matrix before merge; pushes also run all platforms.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces its older run; branch and tag
# runs always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Stacked PRs (base is not master) run Linux only to conserve CI capacity; a
  # PR to master, pushes and manual runs use all platforms, so every PR gets the
  # full matrix before it merges. The decision is printed in this job's log.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      os: ${{ steps.os.outputs.os }}
    steps:
      - id: os
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # In a stacked pull request github.base_ref names the bottom of the
          # stack, so ask the API for this pull request's own base branch.
          if [ "$EVENT" = "pull_request" ] && [ -n "$PR" ]; then
            BASE=$(gh api "repos/$REPO/pulls/$PR" --jq .base.ref)
          fi
          if [ "$EVENT" = "pull_request" ] && [ "$BASE" != "master" ]; then
            os='["ubuntu-latest"]'
          else
            os='["ubuntu-latest", "macos-latest", "windows-latest"]'
          fi
          echo "event=$EVENT base=$BASE platforms=$os"
          echo "os=$os" >> "$GITHUB_OUTPUT"

  check:
    needs: plan
    strategy:
      # Each platform reports its own result, as the OpenClaw job does.
      fail-fast: false
      matrix:
        # Target platforms per spec (macOS and Windows); Ubuntu as the fast default.
        # The plan job picks the platforms (Linux only for stacked PRs).
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # The browser download is cached per OS and Playwright version; Linux
      # still installs its system packages on every run.
      - name: Playwright version
        id: playwright
        shell: bash
        # One browser location per runner, so the cache can restore it.
        run: |
          python -c "from importlib.metadata import version; print('version=' + version('playwright'))" >> "$GITHUB_OUTPUT"
          echo "PLAYWRIGHT_BROWSERS_PATH=${RUNNER_TEMP}/ms-playwright" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell

      # The browser test of the demo UI page script (#89) needs Chromium.
      - name: Install browser
        run: playwright install --with-deps --only-shell chromium

      - name: Test
        # Parallel workers, one test file per worker at a time; on Windows the
        # single-process run took about 29 minutes.
        run: pytest -n auto --dist loadfile --durations=30 --junitxml=ci-evidence/core-tests.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-profile-${{ matrix.os }}
          path: ci-evidence/core-tests.xml
          if-no-files-found: warn
          retention-days: 30

  # The OpenClaw provider plugin (#145; RM33, section 7.5): type, test, and a
  # reproducible release build; the transport and plugin tiers against the real
  # gateway over doubles (RELAYMIND_OPENCLAW_NODE=1 makes a missing dependency a
  # failure, not a skip); then the release artifact through the pinned host's CLI
  # lifecycle in an isolated host home. The gateway answers from doubles: this is
  # a functional check on a GitHub runner, never live model evidence and never a
  # qualification of a user's machine (section 12.5). Live tests stay opt-in.
  openclaw-plugin:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        # The pinned host documents macOS, Linux, and native Windows (WSL2 optional).
        # The plan job picks the platforms (Linux only for stacked PRs).
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      RELAYMIND_OPENCLAW_NODE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The lower bound of the pinned host's engines (>=24.22.1 <25 || >=26.12.1).
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: integrations/openclaw/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          pip install -e ".[dev]"
          npm ci --prefix integrations/openclaw

      - name: Typecheck
        working-directory: integrations/openclaw
        run: npm run typecheck

      - name: Plugin tests
        working-directory: integrations/openclaw
        run: npm test

      - name: Release artifact
        working-directory: integrations/openclaw
        run: npm run pack:release -- ../../release/openclaw

      # Share the check job's browser cache; plugin test tiers remain serial.
      - name: Playwright version
        id: playwright
        shell: bash
        run: |
          python -c "from importlib.metadata import version; print('version=' + version('playwright'))" >> "$GITHUB_OUTPUT"
          echo "PLAYWRIGHT_BROWSERS_PATH=${RUNNER_TEMP}/ms-playwright" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell

      - name: Install browser for plugin UI tests
        run: playwright install --with-deps --only-shell chromium

      # Disposable signed-session accounts exercise person mechanics and the
      # production action factories. The shipped qualification registry stays closed.
      - name: Native person ingress fixture
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 12
        run: |
          python integrations/openclaw/test/host-ordinary-qualification/qualify.py \
            --tarball "release/openclaw/$(node -p "require('./release/openclaw/release.json').filename")" \
            --work-dir "${RUNNER_TEMP}/relaymind-person-qualification" \
            --out ci-evidence/openclaw-person-ingress-ubuntu.json

      - name: Upload native action fixture result immediately
        uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          name: openclaw-native-actions-ubuntu-${{ github.run_attempt }}
          path: ci-evidence/openclaw-person-ingress-ubuntu.json
          if-no-files-found: warn
          retention-days: 30

      # Capability investigation only: an unavailable exact-use route is a
      # blocked capture (exit 0); harness/fixture errors must fail the job.
      # Typical 50–100 s; tier deadline 180 s, plus 60 s for cleanup/export.
      - name: Transport, plugin, and artifact tiers
        run: >
          pytest tests/test_asset_whole_task_host_config.py tests/test_asset_whole_task_inputs.py
          tests/test_openclaw_host_transport.py tests/test_openclaw_plugin.py
          tests/test_openclaw_round_trips.py tests/test_openclaw_cancel_errors.py
          tests/test_openclaw_qualification_script.py tests/test_openclaw_host_captures.py
          tests/test_openclaw_request_size.py tests/test_openclaw_install.py
          tests/test_openclaw_install_check.py tests/test_openclaw_mac_qualification.py
          tests/test_openclaw_mcp_use_qualification.py
          tests/test_openclaw_vps_functional.py tests/test_openclaw_vps_functional_round_trips.py
          tests/test_openclaw_vps_functional_cancel_errors.py
          tests/test_openclaw_vps_functional_install.py tests/test_openclaw_ci_runner_install.py
          tests/test_openclaw_eval_fixtures.py tests/test_openclaw_eval_grading.py
          tests/test_openclaw_eval_runner.py tests/test_openclaw_mac_m9_qualification.py
          tests/test_openclaw_eval_apple_m1.py
          tests/test_openclaw_command_qualification.py
          tests/test_openclaw_mcp_qualification.py
          tests/test_openclaw_person_ingress.py
          tests/test_openclaw_asset_commands.py
          tests/test_openclaw_native_actions.py
          tests/test_openclaw_composed_actions.py
          tests/test_openclaw_recommendation_ui.py
          tests/test_openclaw_ordinary_channel.py
          tests/test_openclaw_walkthrough.py
          tests/test_openclaw_pinned_package.py
          --durations=30 --junitxml=ci-evidence/openclaw-tests.xml

      - name: Pinned host lifecycle (install, inspect, round trips, removal)
        run: |
          tarball="release/openclaw/$(node -p "require('./release/openclaw/release.json').filename")"
          python scripts/openclaw_install_check.py --tarball "$tarball" \
            --out "ci-evidence/openclaw-install-check-${{ matrix.os }}.json" \
            --label "GitHub Actions ${{ matrix.os }} runner, Node $(node --version)" \
            -- node integrations/openclaw/node_modules/openclaw/openclaw.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openclaw-plugin-${{ matrix.os }}
          path: |
            release/openclaw/
            ci-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Disposable MCP use capability fixture
        id: mcp_use_capture
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 4
        run: |
          python integrations/openclaw/test/host-mcp-use-qualification/qualify.py \
            --tarball "release/openclaw/$(node -p "require('./release/openclaw/release.json').filename")" \
            --work-dir "${RUNNER_TEMP}/relaymind-mcp-use-qualification" \
            --out ci-evidence/openclaw-mcp-use-ubuntu.json

      - name: Upload MCP use capability capture
        uses: actions/upload-artifact@v4
        # Upload only when the fixture step ran, so an earlier failure is not
        # masked by a missing-file error; a run that wrote nothing still fails.
        if: always() && matrix.os == 'ubuntu-latest' && steps.mcp_use_capture.outcome != 'skipped'
        with:
          name: openclaw-mcp-use-ubuntu-${{ github.run_attempt }}
          path: ci-evidence/openclaw-mcp-use-ubuntu.json
          if-no-files-found: error
          retention-days: 30

      - name: Native loaded skill observation (outcomes do not qualify use)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 6
        run: |
          python integrations/openclaw/test/host-ordinary-qualification/qualify.py \
            --observe-loaded-use \
            --tarball "release/openclaw/$(node -p "require('./release/openclaw/release.json').filename")" \
            --work-dir "${RUNNER_TEMP}/relaymind-loaded-use-observation" \
            --out ci-evidence/openclaw-loaded-use-observation-ubuntu.json

      - name: Upload native loaded skill observation
        uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          name: openclaw-loaded-use-observation-ubuntu-${{ github.run_attempt }}
          path: ci-evidence/openclaw-loaded-use-observation-ubuntu.json
          if-no-files-found: warn
          retention-days: 30
